<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prevent Default - addEventListener()</title>
  </head>
  <body>
    <h1>Prevent Default</h1>

    <a href="https://www.hashtagtreinamentos.com/curso-javascript" id="meuLink">
      Clique aqui para ir até a página de Javascript da Hashtag!
    </a>

    <script>
      const link = document.getElementById("meuLink");

      // add um evenbto de click no link
      link.addEventListener("click", function (e) {
        e.preventDefault();

        console.log("O comportamento padrão do link foi previnido.");
      });
    </script>
  </body>
</html>
