<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Collection VS NodeList</title>
  </head>
  <body>
    <h1 style="font-size: large">
      Acessando elementos do HTML Collection e NodeList
    </h1>

    <h2 style="font-size: small; color: blue">HTML Collection</h2>
    <ul id="lista">
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ul>

    <h2 style="font-size: small; color: red">NodeList</h2>
    <div id="conteudo">
      <p>Parágrafo 1</p>
      <p>Parágrafo 2</p>
      <p>Parágrafo 3</p>
    </div>
  </body>
</html>
